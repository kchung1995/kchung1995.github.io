{% assign nav_page = page.nav_page | default: 'home' %}
<nav class="nav">
  <div class="nav-inner">
    <a class="nav-brand" href="{{ '/' | relative_url }}">
      <span class="nav-dot"></span>
      <span class="nav-title">{{ site.title | default: '하고 싶은 것을 즐겁게' }}</span>
    </a>
    <div class="nav-links">
      <a class="nav-link{% if nav_page == 'home' %} active{% endif %}" href="{{ '/' | relative_url }}">홈</a>
      <a class="nav-link{% if nav_page == 'tags' %} active{% endif %}" href="{{ '/tags/' | relative_url }}">태그</a>
      <a class="nav-link{% if nav_page == 'search' %} active{% endif %}" href="{{ '/search/' | relative_url }}">검색</a>
      <a class="nav-link" href="https://medium.com/@kchung1995" target="_blank" rel="noopener noreferrer">English</a>
      <button class="nav-toggle" type="button" id="dark-toggle" aria-label="다크 모드 토글">🌙</button>
    </div>
  </div>
</nav>
