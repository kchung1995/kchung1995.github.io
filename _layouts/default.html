<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: 'ko' }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('blog-ui');
          var dark = saved ? (JSON.parse(saved).dark === true) : false;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    {% include masthead.html %}

    <main>
      {{ content }}
    </main>

    {% include footer.html %}
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/code-block.js' | relative_url }}"></script>
    {% include analytics.html %}
  </body>
</html>
